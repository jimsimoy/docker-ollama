version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    # Host port changed from default 11434 to 11435.
    # Bound to 127.0.0.1 so the API is never exposed to the public network.
    # To allow LAN access change to: 0.0.0.0:11435:11434
    ports:
      - "${OLLAMA_HOST_BIND:-127.0.0.1}:${OLLAMA_HOST_PORT:-11435}:11434"

    volumes:
      - ./ollama_data:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh:ro

    entrypoint: ["/bin/bash", "/entrypoint.sh"]

    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}

    # Prevent processes inside the container from gaining new privileges
    security_opt:
      - no-new-privileges:true

    # CPU memory cap (docker-compose standalone v1 compatible syntax)
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-6g}
    memswap_limit: ${OLLAMA_MEMORY_LIMIT:-6g}

    # -----------------------------------------------------------------------
    # NVIDIA GPU support — only needed for locally-hosted models (e.g. llama3, mistral).
    # Cloud models (e.g. kimi-k2:1t-cloud) run inference on the provider's servers
    # and do NOT require a GPU on this host.
    #
    # To enable for local models:
    #   1. Install NVIDIA driver on the host
    #   2. Install nvidia-container-toolkit:
    #      https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    #   3. Configure Docker daemon for the nvidia runtime
    #   4. Uncomment the block below and set NVIDIA_VISIBLE_DEVICES in .env
    # -----------------------------------------------------------------------
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # -----------------------------------------------------------------------

    networks:
      - ai-assistant-ivan-proxy

    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

networks:
  ai-assistant-ivan-proxy:
    external: true
